<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">

    </head>
    <body>
        <main>
  <header>
    <h1>Rock Paper Scissors</h1>
    <p class="sub">Pick one. The computer picks at the same time.</p>
  </header>
 
  <section class="score" aria-label="Score">
    <div><b id="sYou">0</b><span>You</span></div>
    <div><b id="sTie">0</b><span>Ties</span></div>
    <div><b id="sCpu">0</b><span>Computer</span></div>
  </section>
 
  <section class="arena" id="arena" aria-live="polite">
    <div class="side"><div class="hand" id="youHand">✊</div><small>You</small></div>
    <div class="vs">vs</div>
    <div class="side mirror"><div class="hand" id="cpuHand">✊</div><small>Computer</small></div>
  </section>
 
  <p class="result" id="result">Choose your move.</p>
 
  <section class="choices" aria-label="Your choices">
    <button class="choice" data-pick="rock"><span class="e">✊</span><span class="n">Rock</span></button>
    <button class="choice" data-pick="paper"><span class="e">✋</span><span class="n">Paper</span></button>
    <button class="choice" data-pick="scissors"><span class="e">✌️</span><span class="n">Scissors</span></button>
  </section>
 
  <button class="reset" id="reset">Reset score</button>
  <p class="hint">Keyboard: R, P or S</p>
</main>
<script>
(function(){
  var EMOJI = {rock:"✊", paper:"✋", scissors:"✌️"};
  var BEATS = {rock:"scissors", paper:"rock", scissors:"paper"};
  var NAMES = {rock:"Rock", paper:"Paper", scissors:"Scissors"};
  var score = {you:0, tie:0, cpu:0};
  var busy = false;
 
  var $ = function(id){return document.getElementById(id)};
  var arena=$("arena"), youHand=$("youHand"), cpuHand=$("cpuHand"), result=$("result");
  var buttons = document.querySelectorAll(".choice");
 
  function setBusy(b){
    busy = b;
    buttons.forEach(function(btn){btn.disabled = b});
  }
 
  function play(pick){
    if(busy) return;
    setBusy(true);
    var keys = Object.keys(BEATS);
    var cpu = keys[Math.floor(Math.random()*keys.length)];
 
    result.className = "result";
    result.textContent = "Rock… paper… scissors…";
    youHand.textContent = EMOJI.rock;
    cpuHand.textContent = EMOJI.rock;
    arena.classList.add("shaking");
 
    setTimeout(function(){
      arena.classList.remove("shaking");
      youHand.textContent = EMOJI[pick];
      cpuHand.textContent = EMOJI[cpu];
 
      var cls, msg, detail;
      if(pick === cpu){
        score.tie++; cls = ""; msg = "It’s a tie";
        detail = "You both chose " + NAMES[pick].toLowerCase() + ".";
      } else if(BEATS[pick] === cpu){
        score.you++; cls = "win"; msg = "You win!";
        detail = NAMES[pick] + " beats " + NAMES[cpu].toLowerCase() + ".";
      } else {
        score.cpu++; cls = "lose"; msg = "Computer wins";
        detail = NAMES[cpu] + " beats " + NAMES[pick].toLowerCase() + ".";
      }
      result.className = "result " + cls;
      result.innerHTML = "";
      result.appendChild(document.createTextNode(msg));
      var s = document.createElement("small");
      s.textContent = detail;
      result.appendChild(s);
 
      $("sYou").textContent = score.you;
      $("sTie").textContent = score.tie;
      $("sCpu").textContent = score.cpu;
      setBusy(false);
    }, 900);
  }
 
  buttons.forEach(function(btn){
    btn.addEventListener("click", function(){play(btn.dataset.pick)});
  });
 
  document.addEventListener("keydown", function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if(k==="r") play("rock");
    else if(k==="p") play("paper");
    else if(k==="s") play("scissors");
  });
 
  $("reset").addEventListener("click", function(){
    if(busy) return;
    score = {you:0, tie:0, cpu:0};
    ["sYou","sTie","sCpu"].forEach(function(id){$(id).textContent = "0"});
    youHand.textContent = EMOJI.rock;
    cpuHand.textContent = EMOJI.rock;
    result.className = "result";
    result.textContent = "Score reset. Choose your move.";
  });
})();
</script>

    </body>
</html>
